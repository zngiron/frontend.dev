pre-commit:
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  commands:
    validate:
      run: |
        msg=$(cat {1})
        if ! echo "$msg" | grep -qE '^(feat|fix|refactor|docs|test|chore): .+$'; then
          echo "Invalid commit message format."
          echo "Expected: <type>: <description>"
          echo "Types: feat, fix, refactor, docs, test, chore"
          exit 1
        fi
